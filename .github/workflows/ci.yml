name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: server tests
        working-directory: server
        run: |
          npm ci
          npx vitest run --exclude '**/*.live.test.ts'
          npx tsc --noEmit
      - name: surface conformance
        run: node scripts/check-surface.mjs
